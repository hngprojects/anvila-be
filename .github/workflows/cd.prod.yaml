name: Production Branch Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive application build
        run: |
          mkdir app
          cp -r alembic api qa_tests scripts tests requirements.txt alembic.ini app/
          cp *.py app/
          tar -czf python-prod.tar.gz app

      - name: Copy Artifacts to server
        run: |
          sshpass -p ${{ secrets.PASSWORD }} scp -o StrictHostKeyChecking=no python-prod.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/tmp/python
          rm -f python-prod.tar.gz

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd boilerplate/python/prod
            tar -xzf /tmp/python/python-prod.tar.gz -C .
            rm -f /tmp/python/python-prod.tar.gz
            cp .env app/.env
            source venv/bin/activate
            cd app
            pip install -r requirements.txt
            alembic upgrade head
            cd ..
            pm2 restart prod-ecosystem.config.js || pm2 start prod-ecosystem.config.js
