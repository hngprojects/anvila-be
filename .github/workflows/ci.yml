name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    # First CI baseline. Dep install + migrations + full pytest can be slow on a
    # cold runner. Tighten after we have actual run-time data.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    env:
      # Database connection. DB_URL is canonical: alembic/env.py and tests/conftest.py
      # both read decouple_config('DB_URL'). The individual DB_* vars are also required
      # by api/utils/settings.py at import time (python-decouple raises on missing).
      DB_TYPE: postgresql
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      MYSQL_DRIVER: ""

      # JWT / auth (CI-only dummy values; never reuse anywhere else)
      SECRET_KEY: ci-only-not-a-real-secret-do-not-reuse
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_EXPIRY: "7"

      # Mail (decouple-required at Settings import; example.invalid is RFC-2606 reserved)
      MAIL_USERNAME: ci-noreply@example.invalid
      MAIL_PASSWORD: ci-mail-not-a-real-password
      MAIL_FROM: ci-noreply@example.invalid
      MAIL_PORT: "587"
      MAIL_SERVER: smtp.example.invalid

      # Payments / SMS (dummy)
      FLUTTERWAVE_SECRET: ci-flw-not-real
      TWILIO_ACCOUNT_SID: ci-twilio-sid-not-real
      TWILIO_AUTH_TOKEN: ci-twilio-token-not-real
      TWILIO_PHONE_NUMBER: "+10000000000"

      # App metadata
      APP_NAME: anvila-be-ci
      TELEX_WEBHOOK_URL: https://example.invalid/telex

      # OAuth / frontend (referenced in modules outside Settings)
      GOOGLE_CLIENT_ID: ci-google-client-not-real
      GOOGLE_CLIENT_SECRET: ci-google-secret-not-real
      FRONTEND_URL: http://localhost:3000

      # Test-mode flags. ENABLE_INSECURE_TEST_ENDPOINTS must stay false everywhere
      # — it exposes /api/v1/hng-test and /api/v1/all/run-tests (DoS / RCE risk).
      # api/v1/routes/google_login.py:145 checks config("TESTING") != "TEST"
      # to bypass the OAuth state-session check in tests. Must be literally "TEST".
      TESTING: "TEST"
      ENABLE_INSECURE_TEST_ENDPOINTS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: PYTHONPATH=. pytest -v --cov=api
